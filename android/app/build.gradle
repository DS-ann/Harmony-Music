plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def hasGoogleServicesJson = file('google-services.json').exists()
if (hasGoogleServicesJson) {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }

android {
    compileSdkVersion flutter.compileSdkVersion
    // Using NDK 26 ensures compatibility with Android 6 (API 23)
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.anandnet.harmonymusic"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // MultiDex required for Android 6 apps with many dependencies
        multiDexEnabled true

        def auth0Domain = "auth0.invalid"
        def auth0Scheme = "harmonymusic"
        def envFile = rootProject.file("../.env")
        if (envFile.exists()) {
            envFile.eachLine { line ->
                def parts = line.split("=", 2)
                if (parts.size() == 2) {
                    if (parts[0].trim() == "AUTH0_DOMAIN") auth0Domain = parts[1].trim()
                    if (parts[0].trim() == "AUTH0_REDIRECT_SCHEME") auth0Scheme = parts[1].trim()
                }
            }
        }
        manifestPlaceholders += [auth0Domain: auth0Domain, auth0Scheme: auth0Scheme]
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }

        profile {
            applicationIdSuffix ".profile"
            signingConfig signingConfigs.debug
        }

        release {
            applicationIdSuffix ".prod"
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    namespace 'com.anandnet.harmonymusic'
}

flutter {
    source '../..'
}

dependencies {
    // Required for Java 17 features on Android 6
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    implementation 'com.android.support:multidex:2.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.0-beta02'
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
