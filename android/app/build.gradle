plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdkVersion flutter.compileSdkVersion

    // Keep the NDK version from your known-working Android 6 setup
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.anandnet.harmonymusic"

        // Explicit Android 6.0 / API 23 support
        minSdkVersion 23

        targetSdkVersion flutter.targetSdkVersion

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Needed if the final dependency set exceeds the dex limit
        multiDexEnabled true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.anandnet.harmonymusic'
}

flutter {
    source '../..'
}

dependencies {
    // Multidex support for older Android versions
    implementation 'com.android.support:multidex:2.0.1'

    // Existing splash screen dependency
    implementation 'androidx.core:core-splashscreen:1.0.0-beta02'

    // Nearby Connections / Google Nearby
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
