name: just_audio_media_kit
description: Harmony's Windows/Linux MediaKit implementation for just_audio.
version: 1.0.1
publish_to: none

environment:
  sdk: '>=3.1.3 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio_platform_interface: ^4.2.1
  logging: ^1.2.0
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_audio: ^1.0.9

flutter:
  plugin:
    implements: just_audio_platform_interface
    platforms:
      windows:
        dartPluginClass: JustAudioMediaKit
        fileName: just_audio_media_kit.dart
      linux:
        dartPluginClass: JustAudioMediaKit
        fileName: just_audio_media_kit.dart
